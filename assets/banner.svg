  <title>Neeraj Pratap Singh</title>
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#F3E9DA" stroke-opacity=".05"/>
    </pattern>
    <radialGradient id="glow" cx="82%" cy="55%" r="45%">
      <stop offset="0" stop-color="#FF7A3D" stop-opacity=".28"/>
      <stop offset="1" stop-color="#FF7A3D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; }
    .name { font: 800 64px 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #F3E9DA; letter-spacing: -1px; }
    .tag { font-size: 18px; fill: #F5C542; letter-spacing: 2px; }
    .role { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 24px; fill: #CFC3B2; opacity: 0;
             animation: cycle 12s infinite; }
    .r1 { animation-delay: 4s; }
    .r2 { animation-delay: 8s; }
    @keyframes cycle { 0% { opacity: 0; transform: translateY(8px); } 4% { opacity: 1; transform: none; }
                        30% { opacity: 1; transform: none; } 34%, 100% { opacity: 0; transform: translateY(-8px); } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .flame { animation: bob 1.6s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-8px); } }
    .shadow { animation: squish 1.6s ease-in-out infinite; transform-origin: 1101px 290px; }
    @keyframes squish { 50% { transform: scaleX(.8); opacity: .5; } }
    @media (prefers-reduced-motion: reduce) { .flame, .shadow, .caret { animation: none; } .role { animation: none; } .r0 { opacity: 1; } }
  </style>
  <rect width="1280" height="320" rx="20" fill="#1A1714"/>
  <rect width="1280" height="320" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="20" fill="url(#glow)"/>
  <text class="mono tag" x="72" y="92">HI, I'M</text>
  <text class="name" x="68" y="160">Neeraj Pratap Singh</text>
  <rect x="72" y="182" width="56" height="6" fill="#E23A3A"/>
  <rect x="134" y="182" width="18" height="6" fill="#F5C542"/>
  <g>
    <text class="role r0" x="72" y="214">building Alibi, a gym accountability app for squads</text>
    <text class="role r1" x="72" y="214">Flutter · Supabase · Rust · TypeScript · Python</text>
    <text class="role r2" x="72" y="214">data + product, from the schema to the screen</text>
  </g>
  <text class="mono" x="72" y="268" font-size="16" fill="#8A7E70">$ whoami<tspan class="caret" fill="#F5C542"> █</tspan></text>
